<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>CFO Cockpit</title>
<style>
:root{--bg:#EEF2F8;--card:#FFFFFF;--border:#DCE3EE;--ink:#0F172A;--ink2:#334155;--ink3:#64748B;--accent:#1D4ED8;--navy:#0B2A5B;--neg:#D97706;--grid:#E2E8F0;--zebra:#F5F8FD}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 -apple-system,"Segoe UI",Inter,Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
.layout{display:grid;grid-template-columns:216px minmax(0,1fr);min-height:100vh}
aside{position:sticky;top:0;height:100vh;overflow-y:auto;background:linear-gradient(180deg,#0B2A5B 0%,#081D40 100%);color:#fff;padding:24px 16px 18px;display:flex;flex-direction:column;gap:4px}
aside .brand{font-size:18px;font-weight:700;margin:0 0 2px;color:#fff;letter-spacing:-.01em}
aside .co{font-size:12px;color:#BFD3F2;margin-bottom:18px;line-height:1.4}
aside .co b{color:#fff;font-weight:700}
aside nav{display:flex;flex-direction:column;gap:2px}
aside nav a{color:#C7D6EE;text-decoration:none;padding:8px 10px;border-radius:7px;font-size:13.5px;font-weight:500;display:flex;justify-content:space-between;align-items:center;border-left:3px solid transparent}
aside nav a:hover{background:rgba(255,255,255,.08);color:#fff}
aside nav a.active{background:rgba(96,165,250,.18);color:#fff;border-left-color:#60A5FA}
aside nav a.minor{font-size:12.5px;margin-top:6px}
aside .flag{font-size:11px;font-weight:700;color:#FBBF24}
aside .flag.ok{color:#93C5FD}
aside .spacer{flex:1;min-height:16px}
.databox{border-top:1px solid rgba(255,255,255,.15);padding-top:12px;display:flex;flex-direction:column;gap:6px}
.databox .dl{font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:#8FA9D3}
.databox .dn{font-size:12px;color:#fff;word-break:break-all;line-height:1.3}
.databox .ds{font-size:11.5px;color:#BFD3F2;line-height:1.4}
.databox .ds .bad{color:#FBBF24;font-weight:700}
.databox .ds .good{color:#93C5FD;font-weight:700}
.btn{font:inherit;font-size:12.5px;color:var(--ink2);background:#fff;border:1px solid var(--border);border-radius:7px;padding:7px 10px;cursor:pointer;text-align:left}
.btn:hover{background:#F1F4F8;color:var(--ink)}
.btn.primary{background:#2563EB;border-color:#2563EB;color:#fff;font-weight:600;text-align:center}
aside .btn:not(.primary){background:transparent;color:#DCE7F7;border-color:rgba(255,255,255,.25)}
aside .btn:not(.primary):hover{background:rgba(255,255,255,.08);color:#fff}
.btn.primary:hover{background:#1D4ED8}
.wrap{max-width:1240px;margin:0 auto;padding:0 28px 48px;width:100%}
.period{position:sticky;top:10px;z-index:4;background:linear-gradient(100deg,#0B2A5B 0%,#1D4ED8 100%);color:#fff;display:flex;justify-content:space-between;align-items:center;gap:16px;padding:14px 22px;border-radius:12px;margin-top:14px;flex-wrap:wrap;box-shadow:0 6px 18px rgba(11,42,91,.22)}
.period .pl{font-size:11px;text-transform:uppercase;letter-spacing:.1em;color:#BFDBFE;font-weight:700}
.period .pv{font-size:28px;font-weight:800;letter-spacing:-.01em;color:#fff;line-height:1.15}
.period .pd{font-size:12.5px;color:#DBEAFE;text-align:right;line-height:1.6}
.period .pd b{color:#fff;font-weight:700}
.period .pvrow{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.fict{display:inline-block;font-size:10.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;padding:3px 9px;border-radius:999px;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.4);color:#fff;white-space:nowrap}
aside .fict{margin-top:6px;font-size:10px;padding:2px 8px;border-color:rgba(255,255,255,.3)}
#banner{margin-top:16px}
.banner{border-radius:8px;padding:10px 14px;font-size:13px;display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
.banner.ok{background:#EAF0F9;border:1px solid #C9D7EE;color:#173B74}
.banner.err{background:#FDF3E6;border:1px solid #F3D3A6;color:#7A4605}
.banner button{background:none;border:none;font-size:16px;line-height:1;cursor:pointer;color:inherit;padding:0 2px}
h2{font-size:13.5px;font-weight:800;letter-spacing:.09em;text-transform:uppercase;color:var(--navy);margin:30px 0 12px;display:flex;align-items:baseline;gap:12px;padding-left:12px;border-left:4px solid var(--accent);scroll-margin-top:110px}
h2 .lead{text-transform:none;letter-spacing:0;font-weight:500;color:var(--ink);font-size:14.5px}
.grid{display:grid;grid-template-columns:repeat(12,1fr);gap:12px}
.tiles{display:grid;grid-template-columns:repeat(6,1fr);gap:12px}
.tile{background:var(--card);border:1px solid var(--border);border-top:4px solid var(--accent);border-radius:10px;padding:13px 16px 12px;min-height:118px;box-shadow:0 2px 8px rgba(11,42,91,.07)}
.tile .label{font-size:12px;font-weight:700;color:var(--ink2);text-transform:uppercase;letter-spacing:.06em}
.tile .value{font-size:27px;font-weight:800;color:var(--navy);letter-spacing:-.02em;margin:4px 0 2px;font-variant-numeric:tabular-nums}
.tile .delta{font-size:12.5px;font-weight:600;color:var(--ink2)}
.tile .delta.good{color:var(--accent)}
.tile .delta.bad{color:var(--neg)}
.tile .cmp{display:grid;grid-template-columns:auto 1fr;gap:2px 8px;font-size:12px;margin-top:6px;align-items:baseline}
.tile .cmp .k{color:var(--ink3);white-space:nowrap}
.tile .cmp .v{font-weight:700;color:var(--ink2);font-variant-numeric:tabular-nums}
.tile .cmp .v.good{color:var(--accent)}.tile .cmp .v.bad{color:var(--neg)}.tile .cmp .v.na{font-weight:500;color:var(--ink3)}
.tile .cmp .tag{font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.03em;margin-left:4px}
.tilekey{font-size:12.5px;color:var(--ink2);margin:-4px 0 10px;display:flex;gap:6px 16px;flex-wrap:wrap}
.tilekey b{color:var(--navy)}
.tile .note{font-size:11.5px;color:var(--ink3);margin-top:4px}
.spark{display:block;margin-top:6px}
.card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:16px 18px 14px;grid-column:span 6;position:relative;box-shadow:0 2px 8px rgba(11,42,91,.07)}
.card.span3{grid-column:span 3}.card.span4{grid-column:span 4}.card.span8{grid-column:span 8}.card.span12{grid-column:span 12}
.card h3{margin:0;font-size:15px;font-weight:700;color:var(--navy)}
.card .sub{font-size:12.5px;color:var(--ink2);margin:3px 0 10px}
.card .foot{font-size:11.5px;color:var(--ink3);margin-top:8px;border-top:1px solid var(--border);padding-top:6px}
.missing{background:#F6F7F9;border:1px dashed #C9D0DB;border-radius:8px;padding:14px;font-size:12.5px;color:var(--ink2);margin-top:6px}
.chart{display:block;overflow:visible}
.tick{font-size:11.5px;fill:#475569;font-weight:500}
.dlabel{font-size:11.5px;fill:var(--ink);font-weight:700}
.annot{font-size:11px;fill:#B45309;font-weight:600}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:12.5px;font-weight:500;color:var(--ink2);margin:0 0 8px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:6px;vertical-align:-1px}
table.t{width:100%;border-collapse:collapse;font-size:13px;font-variant-numeric:tabular-nums}
table.t th{text-align:right;font-weight:700;color:var(--navy);font-size:11.5px;padding:8px 8px;background:#E8EFFA;border-bottom:1px solid #C9D6EC;text-transform:uppercase;letter-spacing:.04em}
table.t th:first-child{border-top-left-radius:6px}table.t th:last-child{border-top-right-radius:6px}
table.t th:first-child,table.t td:first-child{text-align:left}
table.t td{text-align:right;padding:7px 8px;border-bottom:1px solid var(--border)}
table.t tr:last-child td{border-bottom:none}
table.t tbody tr:nth-child(even) td{background:var(--zebra)}
table.t tbody tr:hover td{background:#E8F0FE}
table.t td:not(:first-child),table.t th:not(:first-child){white-space:nowrap}
table.t td.neg{color:var(--neg);font-weight:600}table.t td.pos{color:var(--accent);font-weight:600}
.stat{display:flex;flex-direction:column;gap:2px}
.stat .v{font-size:23px;font-weight:800;color:var(--navy);letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.stat .l{font-size:12px;color:var(--ink2)}
.stat .l.good{color:var(--accent)}.stat .l.bad{color:var(--neg)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:10px}
ul.watch{margin:0;padding:0;list-style:none}
ul.watch li{padding:7px 0;border-bottom:1px solid var(--border);font-size:13px;display:flex;gap:10px}
ul.watch li:last-child{border-bottom:none}
ul.watch li b{color:var(--neg);font-weight:700;white-space:nowrap}
ul.watch li.ok b{color:var(--accent)}
ul.checks{margin:0;padding:0;list-style:none}
ul.checks li{display:grid;grid-template-columns:22px 1fr;gap:6px;padding:7px 0;border-bottom:1px solid var(--border);font-size:13px}
ul.checks li:last-child{border-bottom:none}
ul.checks .mk{font-weight:700;color:var(--accent)}
ul.checks li.fail .mk{color:var(--neg)}
ul.checks .dt{display:block;font-size:12px;color:var(--neg);margin-top:2px}
table.acc td,table.acc th{padding:5px 8px}
table.acc tr.grp td{font-weight:800;color:var(--accent);font-size:11px;text-transform:uppercase;letter-spacing:.08em;padding-top:14px;background:#fff !important}
table.acc tr.acct td:first-child{padding-left:14px}
table.acc .acno{display:inline-block;min-width:46px;color:var(--ink3);font-size:11.5px}
table.acc tr.sub td{font-weight:600}
table.acc tr.key td{font-weight:800;background:#DCE8FB !important;color:var(--navy)}
table.acc tr.tie td{font-size:12px;font-weight:700;color:var(--accent);border-top:2px solid #C9D6EC;background:#fff !important}
table.acc tr.tie td.bad{color:var(--neg)}
section.collapsed tr.acct,section.collapsed tr.grp{display:none}
.card .tbtoggle{position:absolute;top:12px;right:14px;padding:5px 10px;font-size:12px}
.stale{background:#FDF3E6;border:1px solid #F3D3A6;color:#7A4605;border-radius:7px;padding:8px 12px;font-size:12.5px;margin:4px 0 10px}
.fu{display:inline-block;font-size:10.5px;font-weight:800;padding:2px 8px;border-radius:999px;text-transform:uppercase;letter-spacing:.04em;white-space:nowrap}
.fu.f{background:#DBEAFE;color:#1D4ED8}.fu.u{background:#FEF3C7;color:#B45309}
.conv{display:flex;gap:10px 22px;flex-wrap:wrap;align-items:center;background:#F1F6FF;border:1px solid #CFE0FB;border-radius:10px;padding:10px 14px;font-size:13px;color:var(--ink);margin:2px 0 12px}
.conv b{color:var(--navy)}
table.bv th.grp{text-align:center;background:#D6E3F8;border-bottom:1px solid #C9D6EC}
table.bv td.sep,table.bv th.sep{border-left:2px solid #C9D6EC}
table.bv tr.tot td{font-weight:800;color:var(--navy)}
ul.moved{margin:0;padding:0;list-style:none}
ul.moved li{padding:11px 0;border-bottom:1px solid var(--border)}
ul.moved li:last-child{border-bottom:none}
ul.moved .top{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
ul.moved .nm{font-weight:700;color:var(--ink)}
ul.moved .nm small{font-weight:500;color:var(--ink3);margin-left:6px}
ul.moved .amt{font-weight:800;white-space:nowrap;font-variant-numeric:tabular-nums}
ul.moved .amt.f{color:var(--accent)}ul.moved .amt.u{color:var(--neg)}
ul.moved .ab{font-size:12px;color:var(--ink3);margin-top:2px;font-variant-numeric:tabular-nums}
ul.moved .why{font-size:12.5px;color:var(--ink2);margin-top:4px;line-height:1.5}
#tip{position:fixed;pointer-events:none;background:#0B2A5B;color:#fff;border-radius:6px;padding:6px 9px;font-size:12px;display:none;z-index:9;box-shadow:0 4px 16px rgba(0,0,0,.18);max-width:360px}
#drop{position:fixed;inset:0;background:rgba(31,78,154,.12);border:3px dashed var(--accent);display:none;align-items:center;justify-content:center;font-size:18px;font-weight:600;color:var(--accent);z-index:20}
.credit{font-size:12px;color:var(--ink2);margin-top:8px}.credit a{color:var(--accent);font-weight:600;text-decoration:none}
footer{margin-top:36px;font-size:11px;color:var(--ink3);border-top:1px solid var(--border);padding-top:12px}
@media (max-width:900px){.layout{grid-template-columns:1fr}aside{position:static;height:auto;border-right:none;border-bottom:1px solid var(--border)}aside nav{flex-direction:row;flex-wrap:wrap}aside .spacer{display:none}.tiles{grid-template-columns:repeat(3,1fr)}.card,.card.span3,.card.span4,.card.span8{grid-column:span 12}}
@media print{html,body{background:#fff}.period{position:static}.layout{display:block}aside,#banner,#drop{display:none}.card,.tile{break-inside:avoid;box-shadow:none}}
</style></head>

  sub: ['Subscription Revenue'], svc: ['Professional Services Revenue'], usage: ['Usage & Overage Revenue'], contra: ['Contra Revenue'],
  rev: ['Total Revenue'], cogs: ['Cost of Revenue'], gp: ['Gross Profit'],
  sm: ['Sales & Marketing'], rd: ['Research & Development'], ga: ['General & Administrative'], opex: ['Total Operating Expenses'],
  opinc: ['Operating Income'], oth: ['Other Income / (Expense)', 'Other Income'], tax: ['Income Tax'], ni: ['Net Income'],
  cashOp: ['Cash - Operating'], cashMM: ['Cash - Money Market'], cash: ['Total Cash'],
  ar: ['Accounts Receivable'], defrev: ['Deferred Revenue'],
  openMRR: ['Opening MRR'], newMRR: ['New MRR'], expMRR: ['Expansion MRR'], conMRR: ['Contraction MRR'], churnMRR: ['Churned MRR'],
  mrr: ['Closing MRR'], arr: ['ARR'], cust: ['Active Customers'], newCust: ['New Customers'], churnCust: ['Churned Customers'],
  hc: ['Headcount (FTE)', 'Headcount'],
  allow: ['Allowance for Doubtful Accounts'], defcomm: ['Deferred Commissions'], capsw: ['Capitalised Software, net', 'Capitalized Software, net'],
  accpay: ['Accrued Payroll & Bonus'], loan: ['Notes Payable - Term Loan', 'Term Loan'],
  ta: ['Total Assets'], tl: ['Total Liabilities'], te: ['Total Equity (incl. YTD result)', 'Total Equity']

function norm(h) { return String(h).toLowerCase().replace(/&amp;/g, '&').replace(/[^a-z0-9&%]+/g, ' ').trim(); }

// ---------------------------------------------------------------- CSV
function parseCSV(text) {

    c = text[i];
    if (q) { if (c === '"') { if (text[i + 1] === '"') { f += '"'; i++; } else q = false; } else f += c; }
    else if (c === '"') q = true;
    else if (c === ',') { row.push(f); f = ''; }
    else if (c === '\n' || c === '\r') { if (c === '\r' && text[i + 1] === '\n') i++; row.push(f); f = ''; if (row.length > 1 || row[0].trim() !== '') rows.push(row); row = []; }
    else f += c;

}
function toNum(s) {

  var neg = /^\(.*\)$/.test(s); s = s.replace(/[()$,\s]/g, '');

}
function parseMonth(s) {
  s = String(s).trim(); var m = s.match(/^(\d{4})[-\/](\d{1,2})/);
  if (m) return { y: +m[1], m: +m[2] };

  if (m) { var mi = MN.map(function (x) { return x.toLowerCase(); }).indexOf(m[1].toLowerCase()); var y = +m[2]; if (y < 100) y += 2000; if (mi >= 0) return { y: y, m: mi + 1 }; }
  m = s.match(/^(\d{1,2})[\/\-](\d{4})$/); if (m) return { y: +m[2], m: +m[1] };

}

function buildData(text, name) {
  var rows = parseCSV(text);
  if (rows.length < 3) throw new Error('The file needs a heading row and at least two months of data.');
  var hdr = rows[0].map(norm), idx = {};
  Object.keys(COLS).forEach(function (k) {
    for (var a = 0; a < COLS[k].length; a++) { var j = hdr.indexOf(norm(COLS[k][a])); if (j >= 0) { idx[k] = j; break; } }
  });
  if (idx.month === undefined && idx.monthName !== undefined) idx.month = idx.monthName;
  if (idx.month === undefined) throw new Error('No "Month" column found. The first row must hold the column headings, with one row per month below it.');
  if (idx.rev === undefined && !(idx.sub !== undefined && idx.svc !== undefined && idx.usage !== undefined && idx.contra !== undefined))
    throw new Error('No "Total Revenue" column found, so the cockpit cannot be built from this file.');
  var recs = [], badRows = 0;
  rows.slice(1).forEach(function (r) {
    var pm = parseMonth(r[idx.month]); if (!pm) { badRows++; return; }
    var o = { _y: pm.y, _m: pm.m };
    Object.keys(idx).forEach(function (k) { if (k !== 'month' && k !== 'monthName') o[k] = toNum(r[idx[k]]); });
    recs.push(o);
  });
  if (recs.length < 2) throw new Error('Fewer than two rows have a month the cockpit can read (expected e.g. 2026-09 or Sep 2026).');

  var D = { n: recs.length, file: name, col: {}, raw: {}, derived: [], badRows: badRows };
  D.ym = recs.map(function (r) { return r._y * 12 + r._m - 1; });
  D.labels = recs.map(function (r) { return MN[r._m - 1] + ' ' + String(r._y).slice(2); });
  D.months = recs.map(function (r) { return MN[r._m - 1] + ' ' + r._y; });
  D.full = recs.map(function (r) { return MFULL[r._m - 1] + ' ' + r._y; });
  Object.keys(idx).forEach(function (k) { if (k === 'month' || k === 'monthName') return; D.col[k] = recs.map(function (r) { return r[k]; }); D.raw[k] = true; });
  derive(D);

}

function derive(D) {
  var c = D.col, n = D.n;
  function has() { for (var i = 0; i < arguments.length; i++) if (!c[arguments[i]]) return false; return true; }
  function mk(k, f) { if (c[k]) return; var a = []; for (var i = 0; i < n; i++) a.push(f(i)); c[k] = a; D.derived.push(k); }
  if (has('sub', 'svc', 'usage', 'contra')) mk('rev', function (i) { return c.sub[i] + c.svc[i] + c.usage[i] + c.contra[i]; });
  if (has('rev', 'cogs')) mk('gp', function (i) { return c.rev[i] - c.cogs[i]; });
  if (has('sm', 'rd', 'ga')) mk('opex', function (i) { return c.sm[i] + c.rd[i] + c.ga[i]; });
  if (has('gp', 'opex')) mk('opinc', function (i) { return c.gp[i] - c.opex[i]; });
  if (has('opinc', 'oth', 'tax')) mk('ni', function (i) { return c.opinc[i] + c.oth[i] - c.tax[i]; });
  if (has('cashOp', 'cashMM')) mk('cash', function (i) { return c.cashOp[i] + c.cashMM[i]; });
  if (has('mrr')) { mk('arr', function (i) { return 12 * c.mrr[i]; }); mk('openMRR', function (i) { return i ? c.mrr[i - 1] : NaN; }); }
  // ratios (always computed here so the file never needs to carry them)
  if (has('rev', 'gp')) c.gm = c.gp.map(function (v, i) { return v / c.rev[i]; });
  if (has('rev', 'opinc')) c.om = c.opinc.map(function (v, i) { return v / c.rev[i]; });
  if (has('rev', 'ni')) c.nm = c.ni.map(function (v, i) { return v / c.rev[i]; });
  if (has('rev', 'cogs')) c.cogsPct = c.cogs.map(function (v, i) { return v / c.rev[i]; });
  if (has('mrr', 'cust')) c.arpa = c.mrr.map(function (v, i) { return v / c.cust[i]; });
  if (has('churnCust', 'cust')) c.logoChurn = c.churnCust.map(function (v, i) { var base = i ? c.cust[i - 1] : (c.newCust ? c.cust[0] - c.newCust[0] + v : c.cust[0]); return v / base; });
  if (has('churnMRR', 'openMRR')) c.revChurn = c.churnMRR.map(function (v, i) { return -v / c.openMRR[i]; });
  if (has('mrr', 'openMRR')) c.netg = c.mrr.map(function (v, i) { return v / c.openMRR[i] - 1; });
  if (has('rev', 'hc')) c.rpf = c.rev.map(function (v, i) { return 12 * v / c.hc[i]; });
  if (has('ar', 'rev')) c.dso = c.ar.map(function (v, i) { return v / c.rev[i] * 30; });
}

// ---------------------------------------------------------------- data checks
function runChecks(D) {
  var c = D.col, n = D.n, L = D.months, out = [];
  function raw() { for (var i = 0; i < arguments.length; i++) if (!D.raw[arguments[i]]) return false; return true; }
  function tie(name, ok, diffAt, tol, describe) {

    out.push({ name: name, ok: !bad.length, detail: bad.length ? (bad.length > 1 ? bad.length + ' months off. First: ' : '') + describe(bad[0]) : '' });
  }

  var gaps = [], dupes = [];
  for (var i = 1; i < n; i++) { var d = D.ym[i] - D.ym[i - 1]; if (d === 0) dupes.push(L[i]); else if (d > 1) gaps.push(L[i - 1] + ' → ' + L[i]); }

  var blanks = [];

  out.push({ name: 'No blank or unreadable values', ok: !blanks.length && !D.badRows,
             detail: (blanks.length ? blanks.slice(0, 4).join(', ') + (blanks.length > 4 ? ' and ' + (blanks.length - 4) + ' more' : '') + '. ' : '') + (D.badRows ? D.badRows + ' row(s) skipped: month not recognized.' : '') });
  function moneyDesc(lbl, rep, exp) { return function (i) { return L[i] + ': ' + lbl + ' ' + money(rep(i), 2) + ', expected ' + money(exp(i), 2); }; }
  tie('Total revenue = sum of revenue streams', raw('rev', 'sub', 'svc', 'usage', 'contra'),
      function (i) { return c.rev[i] - (c.sub[i] + c.svc[i] + c.usage[i] + c.contra[i]); }, 1,
      moneyDesc('reported', function (i) { return c.rev[i]; }, function (i) { return c.sub[i] + c.svc[i] + c.usage[i] + c.contra[i]; }));
  tie('Gross profit = revenue − cost of revenue', raw('gp', 'rev', 'cogs'), function (i) { return c.gp[i] - (c.rev[i] - c.cogs[i]); }, 1,
      moneyDesc('reported', function (i) { return c.gp[i]; }, function (i) { return c.rev[i] - c.cogs[i]; }));
  tie('Total opex = S&M + R&D + G&A', raw('opex', 'sm', 'rd', 'ga'), function (i) { return c.opex[i] - (c.sm[i] + c.rd[i] + c.ga[i]); }, 1,
      moneyDesc('reported', function (i) { return c.opex[i]; }, function (i) { return c.sm[i] + c.rd[i] + c.ga[i]; }));
  tie('Operating income = gross profit − opex', raw('opinc', 'gp', 'opex'), function (i) { return c.opinc[i] - (c.gp[i] - c.opex[i]); }, 1,
      moneyDesc('reported', function (i) { return c.opinc[i]; }, function (i) { return c.gp[i] - c.opex[i]; }));
  tie('Net income = operating income + other − tax', raw('ni', 'opinc', 'oth', 'tax'), function (i) { return c.ni[i] - (c.opinc[i] + c.oth[i] - c.tax[i]); }, 1,
      moneyDesc('reported', function (i) { return c.ni[i]; }, function (i) { return c.opinc[i] + c.oth[i] - c.tax[i]; }));
  tie('Total cash = operating + money market', raw('cash', 'cashOp', 'cashMM'), function (i) { return c.cash[i] - (c.cashOp[i] + c.cashMM[i]); }, 1,
      moneyDesc('reported', function (i) { return c.cash[i]; }, function (i) { return c.cashOp[i] + c.cashMM[i]; }));
  function bridge(i) { return c.openMRR[i] + c.newMRR[i] + c.expMRR[i] + c.conMRR[i] + c.churnMRR[i]; }

      function (i) { return c.mrr[i] - bridge(i); }, 0.5, moneyDesc('closing', function (i) { return c.mrr[i]; }, bridge));
  tie('Opening MRR = prior month closing', raw('openMRR', 'mrr'), function (i) { return i ? c.openMRR[i] - c.mrr[i - 1] : NaN; }, 0.5,
      moneyDesc('opening', function (i) { return c.openMRR[i]; }, function (i) { return c.mrr[i - 1]; }));
  tie('Subscription revenue = closing MRR', raw('sub', 'mrr'), function (i) { return c.sub[i] - c.mrr[i]; }, 0.5,
      moneyDesc('subscription revenue', function (i) { return c.sub[i]; }, function (i) { return c.mrr[i]; }));
  tie('ARR = 12 × closing MRR', raw('arr', 'mrr'), function (i) { return c.arr[i] - 12 * c.mrr[i]; }, 1,
      moneyDesc('ARR', function (i) { return c.arr[i]; }, function (i) { return 12 * c.mrr[i]; }));
  tie('Customer count rolls forward (prior + new − churned)', raw('cust', 'newCust', 'churnCust'),
      function (i) { return i ? c.cust[i] - (c.cust[i - 1] + c.newCust[i] - c.churnCust[i]) : NaN; }, 0.5,
      function (i) { return L[i] + ': ' + num(c.cust[i]) + ' reported, ' + num(c.cust[i - 1] + c.newCust[i] - c.churnCust[i]) + ' expected (' + num(c.cust[i - 1]) + ' + ' + num(c.newCust[i]) + ' new − ' + num(c.churnCust[i]) + ' churned)'; });
  tie('Balance sheet balances (assets = liabilities + equity)', raw('ta', 'tl', 'te'), function (i) { return c.ta[i] - c.tl[i] - c.te[i]; }, 1,
      function (i) { return L[i] + ': out by ' + money(c.ta[i] - c.tl[i] - c.te[i], 2); });
  return out;
}

// ---------------------------------------------------------------- chart helpers
function scaleR(vals, lo, hi, pad) {

  var step = (r < 1.5 ? 1 : r < 3.5 ? 2 : r < 7.5 ? 5 : 10) * mag, out = [];
  for (var t = Math.ceil(lo / step) * step; t <= hi + step * 0.01; t += step) out.push(Math.abs(t) < 1e-9 ? 0 : +t.toFixed(10));

}
function f1(x) { return x.toFixed(1); }
function pathD(pts) { return pts.filter(function (p) { return isNum(p[1]); }).map(function (p, i) { return (i ? 'L' : 'M') + f1(p[0]) + ',' + f1(p[1]); }).join(' '); }

function sparkline(vals, color) {
  color = color || C.accent; var w = 120, h = 32, r = scaleR(vals, null, null, 0.1), lo = r[0], hi = r[1], n = vals.length;
  var pts = vals.map(function (v, i) { return [i * (w - 4) / (n - 1) + 2, h - 2 - (v - lo) / (hi - lo) * (h - 4)]; });
  var z = '';

  var l = pts[pts.length - 1];
  return '<svg class="spark" viewBox="0 0 ' + w + ' ' + h + '" width="' + w + '" height="' + h + '" aria-hidden="true">' + z +
    '<path d="' + pathD(pts) + '" fill="none" stroke="' + color + '" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>' +
    '<circle cx="' + f1(l[0]) + '" cy="' + f1(l[1]) + '" r="2.5" fill="' + color + '"/></svg>';
}

function axisLabel(o, t) { return o.axisFmt ? o.axisFmt(t) : (o.pctAxis ? pct(t, 0) : money(t, 1)); }

function lineChart(series, labels, o) {
  o = Object.assign({ w: 560, h: 220, fmt: money, title: '', ylo: null, yhi: null, annotations: [], zeroLine: true, pctAxis: false, directLabel: true, axisFmt: null, annotY: 0 }, o || {});
  var dl = o.directLabel && series.length <= 4, ml = 52, mr = dl ? 118 : 16, mt = 14, mb = 26, w = o.w, h = o.h, pw = w - ml - mr, ph = h - mt - mb;
  var all = []; series.forEach(function (s) { s.vals.forEach(function (v) { if (isNum(v)) all.push(v); }); });
  var r = scaleR(all, o.ylo, o.yhi), lo = r[0], hi = r[1]; if (o.zeroLine && lo > 0) lo = 0;
  var n = labels.length; function X(i) { return ml + i * pw / (n - 1); } function Y(v) { return mt + ph - (v - lo) / (hi - lo) * ph; }

             '<rect x="' + ml + '" y="' + mt + '" width="' + pw + '" height="' + ph + '" fill="' + C.plot + '" rx="3"/>'];
  niceTicks(lo, hi).forEach(function (t) {
    var y = Y(t); out.push('<line x1="' + ml + '" y1="' + f1(y) + '" x2="' + (w - mr) + '" y2="' + f1(y) + '" stroke="' + C.grid + '" stroke-width="1"/>');

  });
  if (lo < 0 && hi > 0) out.push('<line x1="' + ml + '" y1="' + f1(Y(0)) + '" x2="' + (w - mr) + '" y2="' + f1(Y(0)) + '" stroke="' + C.axis + '" stroke-width="1.25"/>');
  var step = Math.max(1, Math.ceil(n / Math.max(2, Math.floor(pw / 64))));
  for (var i = 0; i < n; i += step) out.push('<text x="' + f1(X(i)) + '" y="' + (h - 8) + '" text-anchor="middle" class="tick">' + esc(labels[i]) + '</text>');

    var anchor = ai > n * 0.6 ? 'end' : 'start', dx = anchor === 'end' ? -4 : 4;

  });

      out.push('<path d="' + pathD(good) + ' L' + f1(good[good.length - 1][0]) + ',' + f1(base) + ' L' + f1(good[0][0]) + ',' + f1(base) + ' Z" fill="url(#' + gid + ')" stroke="none"/>');
    }
    out.push('<path d="' + pathD(pts) + '" fill="none" stroke="' + s.color + '" stroke-width="' + (si === 0 ? 2.75 : 2.25) + '" stroke-linejoin="round" stroke-linecap="round"' + (s.dash ? ' stroke-dasharray="' + s.dash + '"' : '') + '/>');
    var l = pts[pts.length - 1];
    out.push('<circle cx="' + f1(l[0]) + '" cy="' + f1(l[1]) + '" r="5" fill="' + s.color + '" stroke="' + C.card + '" stroke-width="2.5"/>');
    ends.push([l[0], l[1] + 4, s.name, o.fmt(s.vals[s.vals.length - 1])]);

    ends.forEach(function (e) {

    out.push('<rect x="' + f1(x0) + '" y="' + mt + '" width="' + f1(x1 - x0) + '" height="' + ph + '" fill="transparent" data-x="' + f1(X(j)) + '" data-tip="' + esc(tip) + '"/>');
  }
  out.push('</g></svg>');

}

function barChart(vals, labels, o) {
  o = Object.assign({ w: 560, h: 220, fmt: money, title: '', color: C.accent, negColor: C.neg, stacked: null, pctAxis: false, axisFmt: null }, o || {});
  var ml = 52, mr = 16, mt = 14, mb = 26, w = o.w, h = o.h, pw = w - ml - mr, ph = h - mt - mb, n = labels.length, tops = [], bots = [], all;

    return '<tr><td>' + b0 + name + b1 + '</td><td>' + b0 + yv + b1 + '</td><td>' + b0 + cv + b1 + '</td><td class="' + cls(good, d) + '">' + b0 + dv + b1 + '</td></tr>';

  var rows = row('Subscription revenue', 'sub') + row('Usage &amp; overage', 'usage') + row('Professional services', 'svc') + row('Contra revenue', 'contra') +
    row('Total revenue', 'rev', { bold: 1 }) + row('Cost of revenue', 'cogs', { low: 1 }) + row('Gross profit', 'gp', { bold: 1 }) + row('Gross margin', 'gm', { pct: 1 }) +
    row('Sales &amp; marketing', 'sm', { low: 1 }) + row('R&amp;D', 'rd', { low: 1 }) + row('G&amp;A', 'ga', { low: 1 }) + row('Total opex', 'opex', { bold: 1, low: 1 }) +
    row('Operating income', 'opinc', { bold: 1 }) + row('Operating margin', 'om', { pct: 1 }) + row('Other income', 'oth') + row('Income tax', 'tax', { low: 1 }) +
    row('Net income', 'ni', { bold: 1 }) + row('Net margin', 'nm', { pct: 1 });
  var flatOther = c.oth && c.tax && amax(c.oth) === amin(c.oth) && amax(c.tax) === amin(c.tax);
  var plSub = 'Revenue ' + pct(M.g, 1, true) + (c.gp ? '; gross profit ' + pct(c.gp[CUR] / c.gp[YOY] - 1, 1, true) : '') +
    (c.opinc ? '; operating ' + (c.opinc[CUR] < 0 ? 'loss ' + (c.opinc[CUR] > c.opinc[YOY] ? 'narrowed' : 'widened') : 'income ' + (c.opinc[CUR] > c.opinc[YOY] ? 'up' : 'down')) + ' by ' + money(Math.abs(c.opinc[CUR] - c.opinc[YOY]), 0) : '');
  out.push(card('P&L: ' + Mo[CUR] + ' vs ' + Mo[YOY], '<table class="t"><thead><tr><th>P&amp;L (USD)</th><th>' + L[YOY] + '</th><th>' + L[CUR] + '</th><th>Change</th></tr></thead><tbody>' + rows + '</tbody></table>',
    { sub: plSub, span: 4, style: 'grid-row:span 2', foot: 'Blue = improvement, amber = deterioration.' + (flatOther ? ' ' + esc(otherNote()) : '') }));

  // margin chart with automatic annotations
  if (c.gm && c.om) {
    var ann = [];
    spikes(c.gm, 0.015).forEach(function (s) { ann.push({ i: s.i, z: Math.abs(s.z), t: L[s.i] + ': gross margin ' + pct(c.gm[s.i]) }); });
    if (c.ga) spikes(c.ga, 0.15 * median(c.ga)).filter(function (s) { return s.r > 0; }).forEach(function (s) { ann.push({ i: s.i, z: Math.abs(s.z), t: L[s.i] + ': G&A spike +' + money(s.r, 0) }); });
    ann.sort(function (a, b) { return b.z - a.z; }); ann = ann.slice(0, 2).sort(function (a, b) { return a.i - b.i; });
    var chart = lineChart([{ name: 'Gross margin', vals: c.gm, color: C.accent }, { name: 'Operating margin', vals: c.om, color: C.dim }], L,
      { w: 760, h: 240, fmt: function (v) { return pct(v); }, pctAxis: true, title: 'Gross and operating margin', annotY: 0.4,
        annotations: ann.map(function (a, k) { return [a.i, a.t, k]; }) });
    var sub = 'Operating margin ' + (c.om[CUR] >= c.om[0] ? 'improved ' : 'declined ') + pp(c.om[CUR] - c.om[0], 0).replace(/^[+-]/, '') + ' over ' + n + ' months; gross margin ' + pct(c.gm[CUR], 0) + ' in ' + Mo[CUR];
    var foot = '';
    if (M.cogsStep) {
      foot = 'Cost of revenue has run at ~' + pct(M.cogsStep.now, 0) + ' of revenue over the last 4 months, vs ~' + pct(M.cogsStep.before, 0) + ' in the 8 months before.';
      if (c.capsw && c.capsw[CUR] > c.capsw[n - 5] * 1.1) foot += ' Capitalized software rose ' + money(c.capsw[n - 5], 2) + ' → ' + money(c.capsw[CUR], 2) + ' over the same period — worth confirming it is not a reclass.';
    }
    if (ann.length) foot += (foot ? ' ' : '') + 'Dashed lines mark months that stand out against their neighbours.';
    out.push(card('Path to breakeven', legend([['Gross margin %', C.accent], ['Operating margin %', C.dim]]) + chart, { sub: sub, span: 8, foot: foot }));
  }

  // cost structure
  if (c.cogs || c.sm) {
    var cr = '';
    [['Cost of revenue', 'cogs'], ['Sales & marketing', 'sm'], ['Research & development', 'rd'], ['General & administrative', 'ga']].forEach(function (p) {
      var k = p[1]; if (!c[k]) return; var a = c[k][CUR] / c.rev[CUR], b = c[k][YOY] / c.rev[YOY], d = a - b;
      cr += '<tr><td>' + esc(p[0]) + '</td><td>' + money(c[k][YOY], 0) + '</td><td>' + money(c[k][CUR], 0) + '</td><td>' + pct(b) + '</td><td>' + pct(a) + '</td><td class="' + (d < 0 ? 'pos' : d > 0.005 ? 'neg' : '') + '">' + pp(d) + '</td></tr>';
    });
    if (c.opex) { var oa = c.opex[CUR] / c.rev[CUR], ob = c.opex[YOY] / c.rev[YOY];
      cr += '<tr><td><b>Total opex</b></td><td><b>' + money(c.opex[YOY], 2) + '</b></td><td><b>' + money(c.opex[CUR], 2) + '</b></td><td><b>' + pct(ob) + '</b></td><td><b>' + pct(oa) + '</b></td><td class="' + (oa < ob ? 'pos' : 'neg') + '"><b>' + pp(oa - ob) + '</b></td></tr>'; }
    out.push(card('Cost structure: now vs a year ago', '<table class="t"><thead><tr><th>Line</th><th>' + L[YOY] + '</th><th>' + L[CUR] + '</th><th>% rev ' + L[YOY] + '</th><th>% rev ' + L[CUR] + '</th><th>Δ</th></tr></thead><tbody>' + cr + '</tbody></table>',
      { sub: c.opex ? 'Total opex ' + (oa < ob ? 'fell' : 'rose') + ' from ' + pct(ob, 0) + ' to ' + pct(oa, 0) + ' of revenue' : '', span: 8, foot: 'Current month vs the same month last year. Lower share of revenue in blue; higher in amber.' }));
  }

  // operating income bars
  if (c.opinc) {
    var allNeg = c.opinc.every(function (v) { return v < 0; }), best = c.opinc[CUR] >= amax(c.opinc), ttm = sum(c.opinc, n - 12, n);
    out.push(card(allNeg ? 'Operating loss by month' : 'Operating income by month', barChart(c.opinc, L, { w: 380, h: 240, title: 'Operating income by month', color: C.accent, negColor: C.dim }),
      { sub: money(c.opinc[CUR], 0) + ' in ' + Mo[CUR] + (best ? ': ' + (allNeg ? 'smallest loss' : 'best month') + ' in the series' : '') + '. TTM operating ' + (ttm < 0 ? 'loss ' : 'income ') + money(ttm),
        span: 4, foot: allNeg ? 'All ' + n + ' months are losses; bar height is the size of the loss.' : '' }));
  }
  // efficiency
  if (c.rpf) {
    out.push(card('Efficiency', '<div class="sub">Revenue per FTE, annualized</div>' +
      lineChart([{ name: 'Revenue / FTE', vals: c.rpf, color: C.accent }], L, { w: 760, h: 150, fmt: function (v) { return money(v, 0); }, directLabel: false, zeroLine: false, axisFmt: function (v) { return money(v, 0); } }) +
      '<div class="sub" style="margin-top:8px">Headcount (FTE)</div>' +
      barChart(c.hc, L, { w: 760, h: 150, fmt: function (v) { return num(v) + ' FTE'; }, color: C.dim, axisFmt: function (v) { return num(v); } }),
      { sub: 'Headcount ' + num(c.hc[0]) + ' → ' + num(c.hc[CUR]) + ' (' + pct(c.hc[CUR] / c.hc[0] - 1, 0, true) + ') while revenue grew ' + pct(c.rev[CUR] / c.rev[0] - 1, 0) + ': revenue per FTE ' + money(c.rpf[0], 0) + ' → ' + money(c.rpf[CUR], 0), span: 8 }));
  } else out.push(missingCard('Efficiency', D, ['hc'], 8));

  var head = (c.gm ? 'Gross margin ' + pct(c.gm[CUR], 0) : '') + (c.om ? ', operating margin ' + pct(c.om[CUR], 0) : '');
  if (c.opex && c.opinc) head += c.opinc[CUR] > c.opinc[YOY] ? '; the result is improving because opex grows slower than revenue.' : '; the result is weakening as costs outpace revenue.';
  return '<h2 id="profitability">Profitability <span class="lead">' + esc(head) + '</span></h2><div class="grid">' + out.join('') + '</div>';
}

function sCash(D, M) {
  var c = D.col, L = D.labels, Mo = D.months, n = D.n, CUR = M.CUR, YOY = M.YOY, out = [];
  if (!c.cash) return '<h2 id="cash">Cash</h2><div class="grid">' + missingCard('Cash position', D, ['cash', 'cashOp', 'cashMM'], 12) + '</div>';
  var ser = [{ name: 'Net cash', vals: c.cash, color: C.accent }], leg = [['Net cash' + (c.cashOp ? ' (operating + money market)' : ''), C.accent]];
  if (c.cashMM) { ser.push({ name: 'Money market', vals: c.cashMM, color: C.dim, dash: '4,3' }); leg.push(['Money market', C.dim]); }
  if (c.cashOp) { ser.push({ name: 'Operating account', vals: c.cashOp, color: C.neg }); leg.push(['Operating account', C.neg]); }
  var negM = c.cashOp ? c.cashOp.filter(function (v) { return v < 0; }).length : 0;
  var sub = 'Net cash ' + money(c.cash[0], 2) + ' → ' + money(c.cash[CUR], 2) + '.' + (negM ? ' The operating account has been overdrawn in ' + negM + ' of ' + n + ' months and sits at ' + money(c.cashOp[CUR], 2) : '');
  var foot = [];
  if (c.cashMM) {
    var diffs = c.cashMM.slice(1).map(function (v, i) { return v - c.cashMM[i]; }), d0 = diffs[0];
    var steadyBefore = diffs.slice(0, -1).every(function (d) { return Math.abs(d - d0) < 0.5; }), last = diffs[diffs.length - 1];
    if (steadyBefore && Math.abs(last - d0) < 0.5) foot.push('Money market moves by exactly $' + grp(d0) + ' every month (interest accrual, never swept).');
    else if (steadyBefore) foot.push('Money market moved by exactly $' + grp(d0) + ' every month until ' + Mo[CUR] + ', when it ' + (last < 0 ? 'fell ' : 'rose ') + money(Math.abs(last), 2) + '.');
    else foot.push('Money market ' + (last < 0 ? 'down ' : 'up ') + money(Math.abs(last), 2) + ' this month.');
  }
  if (c.loan) foot.push('Term loan of ' + money(c.loan[CUR]) + ' is not netted.');
  if (negM) foot.push('If the overdraft is a facility it should be presented as debt.');
  out.push(card('Cash position', legend(leg) + lineChart(ser, L, { w: 760, h: 330, fmt: function (v) { return money(v, 2); }, title: 'Cash position' }), { sub: sub, span: 8, foot: foot.join(' ') }));

  // runway
  if (M.hasYoY) {
    function st(v, label, prior) {
      var d = v - prior, txt = isNum(d) ? (d >= 0 ? '+' : '') + Math.round(d) + ' mo vs ' + L[YOY] + ' reading' : '';
      return '<div class="stat"><div class="v">' + (v === Infinity ? 'n/a' : fmtMo(v) + ' months') + '</div><div class="l">' + label + '</div>' + (txt ? '<div class="l ' + (d >= 0 ? 'good' : 'bad') + '">' + txt + '</div>' : '') + '</div>';
    }
    var body = '<div class="stats" style="grid-template-columns:1fr 1fr">' +
      st(M.runwayCash, M.burnRate > 0 ? 'Months of liquidity, cash basis (' + money(M.burnRate, 0) + '/mo, 12-mo avg)' : 'Cash rose over 12 months', M.runwayCashPrior) +
      (c.ni ? st(M.runwayLoss, M.lossRate > 0 ? 'Months of liquidity, earnings basis (' + money(M.lossRate, 0) + '/mo, 6-mo avg)' : 'Profitable on a 6-month basis', M.runwayLossPrior) : '') + '</div>';
    if (c.ni) {
      var br = [['Net loss', M.ttmNi]], other = M.burn12 - M.ttmNi;
      if (c.defrev) { var dd = c.defrev[CUR] - c.defrev[YOY]; br.push(['Deferred revenue collected ahead of recognition', dd]); other -= dd; }
      if (c.accpay) { var da = c.accpay[CUR] - c.accpay[YOY]; br.push(['Accrued payroll & bonus not paid', da]); other -= da; }
      if (c.ar) { var dr = -(c.ar[CUR] - c.ar[YOY]); br.push(['Receivables growth', dr]); other -= dr; }
      br.push([c.accpay ? 'Other working capital, capex & non-cash items' : 'Other working capital (incl. accrued payroll, not in this file), capex & non-cash', other]);
      body += '<table class="t"><thead><tr><th>Why they differ (last 12 months)</th><th>$</th></tr></thead><tbody>' +
        br.map(function (b) { return '<tr><td>' + esc(b[0]) + '</td><td class="' + (b[1] < 0 ? 'neg' : 'pos') + '">' + money(b[1], 2) + '</td></tr>'; }).join('') +
        '<tr><td><b>Change in net cash</b></td><td class="' + (M.burn12 < 0 ? 'neg' : 'pos') + '"><b>' + money(M.burn12, 2) + '</b></td></tr></tbody></table>';
    }
    var gap = M.burnRate < M.lossRate;
    out.push(card('Liquidity horizon', body, { span: 4, sub: gap ? 'Two bases: the cash basis is supported by liabilities that have not yet been paid' : 'The cash and earnings bases give a similar result',
      foot: c.accpay ? 'If accrued compensation is paid out, the cash-basis measure converges toward the earnings-basis measure.' : 'The gap between the readings is working capital: cash collected ahead of revenue and costs not yet paid.' }));
  }

  // working capital
  var wser = [], wleg = [];
  if (c.defrev) { wser.push({ name: 'Deferred revenue', vals: c.defrev, color: C.accent }); wleg.push(['Deferred revenue', C.accent]); }
  if (c.accpay) { wser.push({ name: 'Accrued payroll & bonus', vals: c.accpay, color: C.neg }); wleg.push(['Accrued payroll & bonus', C.neg]); }
  if (c.ar) { wser.push({ name: 'Accounts receivable', vals: c.ar, color: C.dim }); wleg.push(['Accounts receivable', C.dim]); }
  if (wser.length) {
    var ws = c.accpay ? 'Accrued payroll ' + money(c.accpay[0], 2) + ' → ' + money(c.accpay[CUR], 2) + ' — the largest open question in this pack'
      : (c.defrev ? 'Deferred revenue ' + money(c.defrev[CUR], 2) : '') + (c.ar ? (c.defrev ? '; ' : '') + 'receivables ' + money(c.ar[CUR], 2) : '');
    var wf = (c.defrev && c.sub ? 'Deferred revenue is ' + (c.defrev[CUR] / c.sub[CUR]).toFixed(1) + ' months of subscription revenue. ' : '') +
      (c.dso ? 'AR implies DSO of ~' + Math.round(c.dso[CUR]) + ' days (range ' + Math.round(amin(c.dso)) + '–' + Math.round(amax(c.dso)) + '). ' : '') +
      (!c.accpay ? 'Accrued payroll &amp; bonus is not in this data file.' : '');
    out.push(card('Working capital balances', legend(wleg) + lineChart(wser, L, { w: 560, h: 220, fmt: function (v) { return money(v, 2); }, title: 'Working capital balances' }), { sub: ws, span: 6, foot: wf }));
  } else out.push(missingCard('Working capital balances', D, ['defrev', 'accpay', 'ar']));

  // balance sheet
  if (c.ta && c.tl && c.te) {
    var liab = { defrev: 1, accpay: 1, loan: 1, tl: 1 };
    var items = [['Cash (net)', 'cash'], ['Accounts receivable, net', 'arNet'], ['Deferred commissions', 'defcomm'], ['Capitalized software, net', 'capsw'], ['Total assets', 'ta'],
                 ['Deferred revenue', 'defrev'], ['Accrued payroll & bonus', 'accpay'], ['Term loan', 'loan'], ['Total liabilities', 'tl'], ['Total equity', 'te']];
    if (c.ar && c.allow) c.arNet = c.ar.map(function (v, i) { return v + c.allow[i]; });
    var bt = items.filter(function (it) { return c[it[1]]; }).map(function (it) {
      var a = c[it[1]][0], b = c[it[1]][CUR], d = b - a, good = liab[it[1]] ? d < 0 : d > 0;
      return '<tr><td>' + esc(it[0]) + '</td><td>' + money(a, 2) + '</td><td>' + money(b, 2) + '</td><td class="' + (Math.abs(d) < 1 ? '' : good ? 'pos' : 'neg') + '">' + money(d, 2) + '</td></tr>';
    }).join('');
    out.push(card('Balance sheet: then and now', '<table class="t"><thead><tr><th>Balance sheet</th><th>' + L[0] + '</th><th>' + L[CUR] + '</th><th>Δ ' + n + ' mo</th></tr></thead><tbody>' + bt + '</tbody></table>',
      { sub: 'Equity ' + money(c.te[0]) + ' → ' + money(c.te[CUR]) + (c.tl[CUR] > c.ta[CUR] ? '; liabilities exceed assets by ' + money(c.tl[CUR] - c.ta[CUR]) : ''), span: 6,
        foot: 'Amber = movement that weakens the balance sheet (liabilities up, assets or equity down).' }));
  } else out.push(missingCard('Balance sheet: then and now', D, ['ta', 'tl', 'te', 'accpay', 'loan']));

  var head = 'Net cash ' + money(c.cash[CUR]);
  if (M.hasYoY && c.ni) head += M.runwayCash === Infinity ? '; cash is not falling.' : '; roughly ' + runwayTxt(M.runwayCash) + ' months of liquidity on a cash basis' + (M.runwayLoss < M.runwayCash ? ', but only ~' + runwayTxt(M.runwayLoss) + ' months on an earnings basis.' : '.');
  return '<h2 id="cash">Cash <span class="lead">' + esc(head) + '</span></h2><div class="grid">' + out.join('') + '</div>';
}

function sCustomers(D, M) {
  var c = D.col, L = D.labels, Mo = D.months, n = D.n, CUR = M.CUR, YOY = M.YOY, out = [];
  if (!(c.mrr && c.newMRR && c.expMRR && c.conMRR && c.churnMRR)) return '<h2 id="customers">Customers</h2><div class="grid">' + missingCard('MRR bridge', D, ['openMRR', 'newMRR', 'expMRR', 'conMRR', 'churnMRR', 'mrr'], 12) + '</div>';
  var o = c.openMRR[n - 12], cl = c.mrr[CUR], nn = sum(c.newMRR, n - 12, n), e = sum(c.expMRR, n - 12, n), k = sum(c.conMRR, n - 12, n), h = sum(c.churnMRR, n - 12, n);
  var nrr = (o + e + k + h) / o;
  var wf = waterfall([['Opening MRR ' + L[n - 12], o, 'total'], ['New', nn, 'delta'], ['Expansion', e, 'delta'], ['Contraction', k, 'delta'], ['Churn', h, 'delta'], ['Closing MRR ' + L[CUR], cl, 'total']],
    { w: 760, h: 250, fmt: function (v) { return Math.abs(v) >= 1e6 ? money(v, 2) : money(v, 0); }, title: 'Trailing 12-month MRR bridge' });
  var cover = -(k + h) > 0 ? e / -(k + h) : NaN;
  out.push(card('MRR bridge: last 12 months', wf, { span: 8,
    sub: 'Net new MRR ' + money(cl - o, 0) + ' (' + pct(cl / o - 1, 0, true) + '). Expansion ' + money(e, 0) + (isNum(cover) ? (cover >= 1 ? ' covered' : ' covered only ' + pct(cover, 0) + ' of') + ' churn and contraction ' + money(k + h, 0) + (cover >= 1 ? ' ' + cover.toFixed(1) + '× over' : '') : '') + '; net revenue retention ≈ ' + pct(nrr, 0),
    foot: 'Movements from the contract ledger. Any cent-level rounding in the source bridge is absorbed in the closing bar.' }));

  function l12(a) { return a.slice(-12); }
  var tl = [];
  if (c.netg) tl.push(tile('Net MRR growth', pct(c.netg[CUR]), pp(c.netg[CUR] - c.netg[YOY]) + ' YoY · 12-mo avg ' + pct(mean(l12(c.netg))), c.netg[CUR] >= c.netg[YOY], sparkline(l12(c.netg))));
  if (c.revChurn) tl.push(tile('Gross revenue churn', pct(c.revChurn[CUR]), pp(c.revChurn[CUR] - c.revChurn[YOY]) + ' YoY · 12-mo avg ' + pct(mean(l12(c.revChurn))), c.revChurn[CUR] <= c.revChurn[YOY], sparkline(l12(c.revChurn), C.neg)));
  if (c.logoChurn) tl.push(tile('Logo churn', pct(c.logoChurn[CUR]), pp(c.logoChurn[CUR] - c.logoChurn[YOY]) + ' YoY · ' + num(sum(c.churnCust, n - 12, n)) + ' logos lost in 12 mo', c.logoChurn[CUR] <= c.logoChurn[YOY], sparkline(l12(c.logoChurn), C.neg)));
  if (c.arpa) tl.push(tile('ARPA (monthly)', '$' + grp(c.arpa[CUR]), pct(c.arpa[CUR] / c.arpa[YOY] - 1, 1, true) + ' YoY', c.arpa[CUR] >= c.arpa[YOY], sparkline(l12(c.arpa))));
  out.push(card('Retention & pricing', '<div class="tiles" style="grid-template-columns:repeat(2,1fr)">' + tl.join('') + '</div>', { sub: 'Monthly rates. Amber sparklines are churn metrics (lower is better)', span: 4 }));

  var fell = []; for (var i = 0; i < n; i++) if (c.mrr[i] < c.openMRR[i]) fell.push(Mo[i]);
  var bestExp = c.expMRR[CUR] >= amax(c.expMRR);
  var msub = (M.churnSpike !== undefined ? Mo[M.churnSpike] + ': ' + money(-c.churnMRR[M.churnSpike], 0) + ' churned' + (c.churnCust ? ' (' + num(c.churnCust[M.churnSpike]) + ' logos)' : '') + '. ' : '') +
    (fell.length ? 'MRR fell in ' + (fell.length === 1 ? fell[0] + ' only' : fell.length + ' months') + '. ' : 'MRR grew every month. ') +
    (bestExp ? Mo[CUR] + ' had the strongest expansion in the series (' + money(c.expMRR[CUR], 0) + ').' : '');
  out.push(card('Monthly MRR movement', legend([['New', C.accent], ['Expansion', C.dim], ['Contraction', C.faint], ['Churn', C.neg]]) +
    barChart(null, L, { w: 560, h: 230, fmt: function (v) { return money(v, 0); }, title: 'Monthly MRR movement', stacked: [
      { name: 'New', vals: c.newMRR, color: C.accent }, { name: 'Expansion', vals: c.expMRR, color: C.dim }, { name: 'Contraction', vals: c.conMRR, color: C.faint }, { name: 'Churn', vals: c.churnMRR, color: C.neg }] }),
    { sub: msub, span: 6, foot: 'Additions above the axis, losses below. Hover any month for the full breakdown.' }));

  if (c.cust) {
    var body = '<div class="sub">Active customers</div>' + lineChart([{ name: 'Active customers', vals: c.cust, color: C.accent }], L, { w: 560, h: 140, fmt: num, axisFmt: num, zeroLine: false, title: 'Active customers' });
    if (c.newCust && c.churnCust) body += '<div class="sub" style="margin-top:6px">New (above) and churned (below) customers per month</div>' +
      barChart(null, L, { w: 560, h: 120, fmt: num, axisFmt: num, title: 'New and churned customers', stacked: [{ name: 'New', vals: c.newCust, color: C.accent }, { name: 'Churned', vals: c.churnCust.map(function (v) { return -v; }), color: C.neg }] });
    var csub = num(c.cust[0]) + ' → ' + num(c.cust[CUR]) + ' customers' + (c.newCust ? '; ' + num(sum(c.newCust, n - 12, n)) + ' added and ' + num(sum(c.churnCust, n - 12, n)) + ' lost in the last 12 months' : '') +
      (c.arpa ? '. ARPA ' + pct(c.arpa[CUR] / c.arpa[0] - 1, 0, true) + ' over ' + n + ' months' : '');
    out.push(card('Customer base', body, { sub: csub, span: 6 }));
  }

  return { v: v, drivers: dtxt, text: 'Year-to-date operating income ' + smoney(v) + ' vs budget (' + ytd[0].m.slice(0, 3) + '–' + D.months[D.n - 1] + ')' + (dtxt ? '; mainly ' + dtxt : '') + '.' };
}

function sBudget(D, M) {
  if (!BUDGET) return '';
  if (BUDGET.error) return '<h2 id="budget">Actual vs Budget</h2><div class="grid">' + card('Actual vs Budget', '<div class="missing">Could not read the embedded budget: ' + esc(BUDGET.error) + '</div>', { span: 12 }) + '</div>';
  var CUR = D.n - 1, curM = D.months[CUR], ms = BUDGET.months;
  if (ms.indexOf(curM) < 0) return '<h2 id="budget">Actual vs Budget</h2><div class="grid">' + card('Actual vs Budget', '<div class="missing">The budget covers ' + esc(ms[0]) + ' – ' + esc(ms[ms.length - 1]) + '. The loaded data ends in ' + esc(curM) + ', which is outside it.</div>', { span: 12 }) + '</div>';
  var ytd = ytdMonths(D), mon = [{ m: curM, i: CUR }], ytdLbl = ytd[0].m.slice(0, 3) + '–' + curM.slice(0, 3) + ' ' + curM.slice(-4), curShort = D.labels[CUR];
  function A(k, L) { return L.reduce(function (s, x) { return s + aLine(D, k, x.i); }, 0); }
  function B(k, L) { return L.reduce(function (s, x) { return s + bLine(k, x.m); }, 0); }

  // 1. scorecard by P&L line
  var lines = ['rev', 'cogs', 'gp', 'sm', 'rd', 'ga', 'opinc', 'ni'], tot = { rev: 1, gp: 1, opinc: 1, ni: 1 };
  var rows = lines.map(function (k) {
    var g = BLINES[k][1], a1 = A(k, mon), b1 = B(k, mon), v1 = a1 - b1, a2 = A(k, ytd), b2 = B(k, ytd), v2 = a2 - b2;
    function vc(v) { return '<td class="' + (Math.abs(v) < 0.5 ? '' : (v * g > 0 ? 'pos' : 'neg')) + '">' + smoney(v) + '</td>'; }
    return '<tr class="' + (tot[k] ? 'tot' : '') + '"><td>' + esc(BLINES[k][0]) + '</td><td>' + money(a1, 2) + '</td><td>' + money(b1, 2) + '</td>' + vc(v1) + '<td>' + chip(g, v1) + '</td>' +
      '<td class="sep">' + money(a2, 2) + '</td><td>' + money(b2, 2) + '</td>' + vc(v2) + '<td>' + pct(v2 / Math.abs(b2), 1, true) + '</td><td>' + chip(g, v2) + '</td></tr>';
  }).join('');
  var conv = '<div class="conv"><span><b>How to read this:</b> variance = actual − budget.</span><span><b>Revenue and profit:</b> above budget is <span class="fu f">Favorable</span></span>' +
    '<span><b>Costs:</b> below budget is <span class="fu f">Favorable</span></span><span>Year to date = ' + esc(ytdLbl) + ' (fiscal year = calendar ' + esc(ms[0].slice(-4)) + ').</span></div>';
  var table = '<table class="t bv"><thead><tr><th></th><th colspan="4" class="grp">' + esc(D.full[CUR]) + '</th><th colspan="5" class="grp sep">Year to date · ' + esc(ytdLbl) + '</th></tr>' +
    '<tr><th>P&amp;L line</th><th>Actual</th><th>Budget</th><th>Variance</th><th></th><th class="sep">Actual</th><th>Budget</th><th>Variance</th><th>%</th><th></th></tr></thead><tbody>' + rows + '</tbody></table>';
  var oM = A('opinc', mon) - B('opinc', mon), oY = A('opinc', ytd) - B('opinc', ytd);
  var scard = card('Scorecard: actual vs budget', conv + table, { span: 12,
    sub: 'Operating income ' + smoney(oM) + ' vs budget in ' + D.full[CUR] + ' and ' + smoney(oY) + ' year to date (actual ' + money(A('opinc', ytd), 2) + ' vs budget ' + money(B('opinc', ytd), 2) + ').' });

  // 2. year-to-date bridge: budget operating income → actual
  var dk = [['Revenue', 'rev'], ['COGS', 'cogs'], ['S&M', 'sm'], ['R&D', 'rd'], ['G&A', 'ga']];
  var steps = [['Budget YTD', B('opinc', ytd), 'total', C.faint]];
  dk.forEach(function (x) { var v = A(x[1], ytd) - B(x[1], ytd); steps.push([x[0], v * BLINES[x[1]][1], 'delta']); });
  steps.push(['Actual YTD', A('opinc', ytd), 'total', C.accent]);
  var wf = waterfall(steps, { w: 560, h: 260, title: 'Year-to-date operating income: budget to actual', fmt: function (v) { return Math.abs(v) >= 1e6 ? money(v, 2) : money(v, 0); }, dfmt: function (v) { return smoney(v, 0); } });
  var bridge = card('Year to date: where the gap comes from', legend([['Helps operating income', C.dim], ['Hurts operating income', C.neg]]) + wf,
    { span: 6, sub: 'Budgeted operating income ' + money(B('opinc', ytd), 2) + ' → actual ' + money(A('opinc', ytd), 2) + ' (' + ytdLbl + '). Each bar is a P&L line\'s effect on operating income.' });

  // 3. monthly operating-income variance
  var mv = ytd.map(function (x) { return aLine(D, 'opinc', x.i) - bLine('opinc', x.m); }), ml = ytd.map(function (x) { return D.labels[x.i]; });
  var behind = mv.filter(function (v) { return v < 0; }).length;
  var trend = Math.abs(mv[mv.length - 1]) < 0.6 * Math.abs(mv[0]) ? 'narrowing' : Math.abs(mv[mv.length - 1]) > 1.4 * Math.abs(mv[0]) ? 'widening' : 'steady';
  var mcard = card('Operating income vs budget, month by month', barChart(mv, ml, { w: 560, h: 260, color: C.accent, negColor: C.neg, fmt: function (v) { return smoney(v, 0); }, title: 'Monthly operating income variance' }),
    { span: 6, sub: (behind ? 'Behind budget in ' + behind + ' of ' + mv.length + ' months' : 'Ahead of budget every month') + '; ' + D.labels[CUR] + ': ' + smoney(mv[mv.length - 1], 0) + '. Gap ' + trend + ' since ' + ml[0] + ' (' + smoney(mv[0], 0) + ').',
      foot: 'Blue bars beat budget; amber bars fell short.' });

  // 4. what moved — latest trial-balance month, by account
  var acctCard = '';
  if (TB && !TB.error && ms.indexOf(TB.cur.label) >= 0) {
    var p = TB.cur, pm = TB.pm, py = TB.py, tm = p.label;
    var cands = BUDGET.list.filter(function (a) { return p.acc[a]; }).map(function (a) {
      var act = tbPos(p, a), bud = bAcct(a, tm); return { a: a, n: p.acc[a].n, act: act, bud: bud, v: act - bud, g: acctGood(a) }; })
      .sort(function (x, y) { return Math.abs(y.v) - Math.abs(x.v); }).slice(0, 5);
    var pairs = { '60120': '1250', '50600': '1300' };
    function why(x) {
      var bits = [], jul = tbPos(pm, x.a), ly = tbPos(py, x.a), isAm = /amorti[sz]ation/i.test(x.n);
      if (isAm) {
        bits.push('Non-cash accounting charge. Budget assumed ' + m0(x.bud) + '; actual has ' + (isNum(ly) && x.act < ly ? 'fallen to ' + m0(x.act) + ' from ' + m0(ly) + ' a year ago' : 'run at ' + m0(x.act)));
        var bs = pairs[x.a];
        if (bs && p.acc[bs] && py && py.acc[bs]) {
          var b0 = py.acc[bs].cl, b1 = p.acc[bs].cl, nm = p.acc[bs].n;
          bits.push(nm + ' balance ' + (b1 < b0 ? 'fell' : 'rose') + ' from ' + m0(b0) + ' to ' + m0(b1) + (b1 > b0 && x.act < ly ? ', so amortization fell while the asset grew — worth asking why' : ''));
        }
        if (x.v * x.g > 0) bits.push('favorable on paper, not an operating saving');
      } else if (x.a === '40100' && D.col.sub) {
        var j0 = D.months.indexOf(ms[0]), b0m = bAcct('40100', ms[0]), span = ms.indexOf(tm);
        if (j0 >= 0 && span > 0) {
          var planG = Math.pow(x.bud / b0m, 1 / span) - 1, actG = Math.pow(x.act / D.col.sub[j0], 1 / span) - 1;
          bits.push('Plan assumes ' + pct(planG, 1) + ' growth a month; actual has grown ' + pct(actG, 1) + ' a month since ' + ms[0].slice(0, 3));
        }
        if (M.churnSpike !== undefined && ms.indexOf(D.months[M.churnSpike]) >= 0) bits.push(D.months[M.churnSpike].slice(0, 3) + '\'s churn (' + money(-D.col.churnMRR[M.churnSpike], 0) + ' MRR lost) reset the base');
      } else {
        bits.push('Budget assumed ' + m0(x.bud) + '; actual ' + m0(x.act));
        if (isNum(jul)) bits.push(Math.abs(x.act - jul) <= 0.02 * Math.abs(x.act) ? 'flat vs ' + pm.label.slice(0, 3) + ', so this is the run-rate, not a one-off' : (x.act > jul ? 'up ' : 'down ') + money(Math.abs(x.act - jul), 0) + ' vs ' + pm.label.slice(0, 3));
        if (isNum(ly) && ly) bits.push(pct(x.act / ly - 1, 0, true) + ' vs ' + py.label);
      }
      if (p.acc[x.a].cr >= 1 && tbGroup(x.a) !== 'rev' && tbGroup(x.a) !== 'oth') bits.push('shown net of ' + money(p.acc[x.a].cr, 0) + ' capitalized to the balance sheet');
      return capF(bits.join('; ')) + '.';
    }
    var li = cands.map(function (x) {
      var f = x.v * x.g > 0;
      return '<li><div class="top"><span class="nm">' + esc(x.n) + '<small>' + esc(x.a) + '</small></span><span><span class="amt ' + (f ? 'f' : 'u') + '">' + smoney(x.v, 0) + '</span> ' + chip(x.g, x.v) + '</span></div>' +
        '<div class="ab">Actual ' + m0(x.act) + ' · Budget ' + m0(x.bud) + '</div><div class="why">' + esc(why(x)) + '</div></li>';
    }).join('');
    acctCard = card('What moved in ' + tm + ' — top 5 accounts', '<ul class="moved">' + li + '</ul>',
      { span: 6, sub: 'The five accounts furthest from budget, from the trial balance. The other ' + (BUDGET.list.length - 5) + ' accounts are left out on purpose.',
        foot: tm !== curM ? 'Account detail is for ' + esc(tm) + ' (latest trial balance); the rest of this section shows ' + esc(curM) + '.' : '' });
  }

  // 5. what moved — year to date, by P&L line
  var yk = ['sub', 'svc', 'usage', 'contra', 'cogs', 'sm', 'rd', 'ga'].map(function (k) { return { k: k, v: A(k, ytd) - B(k, ytd), g: BLINES[k][1] }; })
    .sort(function (x, y) { return Math.abs(y.v) - Math.abs(x.v); }).slice(0, 4);
  var oneOff = /no one-off/i.test(BUDGET.assumptions);
  function ywhy(x) {
    var k = x.k, vs = ytd.map(function (y) { return aLine(D, k, y.i) - bLine(k, y.m); }), n = vs.length, lab = ytd.map(function (y) { return y.m.slice(0, 3); }), parts = [];
    var flips = 0, jj = -1; for (var t = 1; t < n; t++) if ((vs[t] >= 0) !== (vs[t - 1] >= 0)) { flips++; jj = t; }
    if (!flips) parts.push(capF(vword(x.g, vs[0])) + ' budget in all ' + n + ' months');
    else if (flips === 1) parts.push(capF(vword(x.g, vs[0])) + ' budget ' + lab[0] + '–' + lab[jj - 1] + ', ' + vword(x.g, vs[jj]) + ' since ' + lab[jj] +
      (k === 'sub' && M.churnSpike !== undefined && D.months[M.churnSpike] === ytd[jj].m ? ', the month of the ' + money(-D.col.churnMRR[M.churnSpike], 0) + ' churn spike' : ''));
    else parts.push(capF(vword(x.g, x.v)) + ' budget in ' + vs.filter(function (v) { return (v >= 0) === (x.v >= 0); }).length + ' of ' + n + ' months');
    var ab = vs.map(Math.abs), mi = ab.indexOf(Math.max.apply(null, ab)), others = vs.filter(function (v, t) { return t !== mi; });
    if (n >= 4 && ab[mi] > 2.5 * median(others.map(Math.abs))) {
      parts.push('largest in ' + lab[mi] + ' (' + smoney(vs[mi], 0) + ')' + (oneOff && vs[mi] * x.g < 0 ? ', a one-off the budget did not include' : '') + '; the other months average ' + smoney(mean(others), 0));
    } else {
      parts.push('averaging ' + smoney(mean(vs), 0) + ' a month');
      var tr = Math.abs(vs[n - 1]) < 0.6 * Math.abs(vs[0]) ? 'narrowing' : Math.abs(vs[n - 1]) > 1.4 * Math.abs(vs[0]) ? 'widening' : '';
      if (tr && !flips) parts.push('gap ' + tr + ' from ' + smoney(vs[0], 0) + ' in ' + lab[0] + ' to ' + smoney(vs[n - 1], 0) + ' in ' + lab[n - 1]);
    }
    var s = capF(parts.join('; ')) + '.';
    if (TB && !TB.error && ms.indexOf(TB.cur.label) >= 0) {   // cross-reference the account detail
      var ti = ytd.filter(function (y) { return y.m === TB.cur.label; })[0];
      if (ti && ['cogs', 'sm', 'rd', 'ga', 'sub'].indexOf(k) >= 0) {
        var lv = aLine(D, k, ti.i) - bLine(k, ti.m), best = null;
        TB.cur.list.forEach(function (a) { if ((k === 'sub' ? a === '40100' : tbGroup(a) === k) && BUDGET.acc[a]) { var v = tbPos(TB.cur, a) - bAcct(a, ti.m); if (!best || Math.abs(v) > Math.abs(best.v)) best = { a: a, v: v }; } });
        if (best && k !== 'sub' && Math.abs(lv) > 1 && best.v * lv > 0 && Math.abs(best.v) >= 0.6 * Math.abs(lv))
          s += ' In ' + TB.cur.label.slice(0, 3) + ', ' + TB.cur.acc[best.a].n + ' alone is ' + smoney(best.v, 0) + (/amorti[sz]ation/i.test(TB.cur.acc[best.a].n) ? ' (non-cash)' : '') + '.';
      }
    }
    return s;
  }
  var yli = yk.map(function (x) {
    var f = x.v * x.g > 0;
    return '<li><div class="top"><span class="nm">' + esc(BLINES[x.k][0]) + '</span><span><span class="amt ' + (f ? 'f' : 'u') + '">' + smoney(x.v, 0) + '</span> ' + chip(x.g, x.v) + '</span></div>' +
      '<div class="ab">Actual ' + money(A(x.k, ytd), 2) + ' · Budget ' + money(B(x.k, ytd), 2) + '</div><div class="why">' + esc(ywhy(x)) + '</div></li>';
  }).join('');
  var ycard = card('What moved year to date — top 4 P&L lines', '<ul class="moved">' + yli + '</ul>',
    { span: acctCard ? 6 : 12, sub: 'The four P&L lines furthest from budget, ' + ytdLbl + '. Year to date is by line because account detail exists only for the trial-balance month.' });

  var foot = 'Budget: ' + esc(BUDGET.file) + ' (headings on row ' + BUDGET.headerRow + '). That file states every figure as positive and subtracts contra revenue, so actual contra revenue (negative in the summary file) is shown here as a positive deduction. ' +
    (BUDGET.assumptions ? 'Budget basis, per the file: ' + esc(BUDGET.assumptions) : '');
  var head = D.full[CUR] + ': operating income ' + smoney(oM, 0) + ' vs budget; year to date ' + smoney(oY) + ' (' + pct(oY / Math.abs(B('opinc', ytd)), 0, true) + ').';
  var bh = budgetHeadline(D); if (bh && bh.drivers) head += ' Mainly ' + bh.drivers + '.';
  return '<h2 id="budget">Actual vs Budget <span class="lead">' + esc(head) + '</span></h2><div class="grid">' + scard + bridge + mcard + ycard + acctCard + '</div>' +
    '<div class="card span12" style="margin-top:12px;padding:10px 18px"><div class="foot" style="border:none;margin:0;padding:0">' + foot + '</div></div>';
}

function banner(kind, html) {

}
function loadText(text, name, announce) {
  try {
    var prev = STATE ? STATE.D.months[STATE.D.n - 1] : null, D = buildData(text, name); D._csv = text;
    render(D);
    if (announce) {
      var now = D.months[D.n - 1], fails = runChecks(D).filter(function (x) { return !x.ok; }).length;
      banner(fails ? 'err' : 'ok', 'Loaded <b>' + esc(name) + '</b>: now showing <b>' + esc(now) + '</b> (' + D.n + ' months' + (prev && prev !== now ? ', was ' + esc(prev) : '') + '). ' +
        (fails ? fails + ' data check' + (fails > 1 ? 's' : '') + ' failed — <a href="#checks">see Data checks</a>.' : 'All data checks pass.'));
      window.scrollTo(0, 0);
